# Manifesto do perfil "agrominds" (spec profiles-modules RF-03).
# O código da fita (clima, alertas, painel) fica em extensao/; regras agronômicas em regras/ (revisáveis sem programar).
nome: agrominds
versao: 0.3.0
descricao: Tempo e época de plantio pelo Telegram para quem planta em qualquer escala (roça, sítio, horta, vaso), com boletins e alertas em imagem e o zoneamento oficial (ZARC). Grupo 7, Agentes Inteligentes T4.
requer:
  tocador: ">=1.0"

identidade:
  nome: AgroMinds
  emoji: 🌱
  dono: Grupo 7
  proposito: avisar sobre o tempo onde a pessoa planta, dizer a época de plantar e ajudar no manejo do dia a dia
  instrucoes: |
    Você ajuda quem planta em qualquer escala: produtores rurais, quem tem horta ou vasos em casa, técnicos e estudantes.
    Fale em português simples, como num bate-papo no campo, sem jargão desnecessário.
    Quando a resposta depender de região, cultura ou época do ano, pergunte antes de responder.
    Não invente números (doses, preços, previsões): quando não tiver a informação, diga e sugira onde conferir.
    Para tempo, chuva, geada, pulverização, irrigação, colheita ou época de plantio, use as ferramentas da fita (clima_lavoura,
    previsao_periodo, chuva_por_hora, radar_chuva, epoca_de_plantio, minhas_plantas, balanco_agua): os números vêm delas e a
    imagem com os dados vai junto da sua resposta. Horário da chuva nos próximos dias: chuva_por_hora (a semana = 168 horas);
    chuva agora ou chegando nas próximas horas: radar_chuva.
    Não indique outros aplicativos, sites ou serviços de previsão do tempo, nem como sugestão: responda com as ferramentas
    da fita e, se algo não estiver nelas, diga só que não tem essa informação. Se a pessoa ainda não mandou a localização, repita o jeito de mandar que a ferramenta
    trouxe (ele já vem certo para o canal em que a pessoa está); não fale de outro canal.
    Pedido de mensagem automática (receber o tempo todo dia, mudar o horário, parar ou voltar a receber): use
    avisos_automaticos e repita o que ela disser sobre onde e quando a mensagem chega.
    Defensivo agrícola (produto e dose) só com receituário de um(a) agrônomo(a): nunca indique produto nem dose.

# Módulos do tocador que este perfil liga:
#   arquivos     Ferramentas de arquivos no workspace (criar, ler, listar)
#   voz          Mensagens de voz: transcrição (Whisper) e respostas em áudio (Kokoro/Edge)
#   voz-clonada  Clonagem de voz (Chatterbox): /minhavoz, /falar e skill voz-clonada
#   refinamento  Raciocínio: criador ↔ crítico, análise em etapas, debate entre agentes e criador de prompts
#   http         Ferramentas HTTP declaradas pelo perfil em ferramentas/*.yaml (APIs REST, sem código)
#   pesquisa-web Pesquisa na internet, leitura de páginas e notícias (SearXNG/DuckDuckGo, Google News)
#   anexos       Imagens e documentos enviados: visão, OCR, biblioteca com busca (listar_anexos, ler_anexo...)
#   imagens      Geração de imagens na GPU (ComfyUI + SDXL): ilustração, HQ, anime e mangá
#   conhecimento Base de conhecimento (RAG): documentos da fita em conhecimento/, busca híbrida e citações
modulos:
  arquivos: {}
  anexos: {}
  pesquisa-web: {}
  voz: {}

# Canais: telegram, terminal, web (chat no navegador). Bot da fita: npm run perfil -- bot agrominds --gerente
# foco: restrito = só o propósito da fita; outro assunto recebe "isso este bot não faz", o que ele faz e exemplos.
foco: restrito

canais: [telegram, terminal, web]

# Quem pode usar o bot: só convidados (QR code) e pedidos aprovados pelos donos. Convites: /convite no bot,
# na página de administração do K7 ou no painel da AgroMinds.
telegram:
  acesso: aberto

# Código da fita: tempo (Open-Meteo), época de plantio (ZARC), conversa no Telegram, imagens (layouts/), ferramentas do
# agente e o painel (Angular).
extensao: extensao/index.ts

# publico | pessoal | local (local = só modelos na sua GPU)
privacidade: publico

# Variáveis que o .env do perfil precisa ter (o instalador avisa as que faltam)
variaveis: {}
vitrine: true
